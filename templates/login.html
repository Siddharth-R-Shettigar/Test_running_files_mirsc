<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KAVACH — Officer Sign In</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/kavach.css') }}">
</head>
<body>

  <!-- Ambient Organic Orange Background Mesh Orbs -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-orb ambient-orb-2"></div>
    <div class="ambient-orb ambient-orb-3"></div>
  </div>

  <!-- Minimal Floating Navigation -->
  <nav class="floating-chrome" aria-label="Top Controls">
    <div class="floating-cluster-left">
      <a class="float-ctrl float-pill brand-pill" href="{{ url_for('home') }}" title="Back to Home">
        <span class="brand-k-badge">K</span>
        <span class="wordmark">Kavach<span class="dot"></span></span>
      </a>
    </div>
    <div class="floating-cluster-right">
      <button type="button" class="float-ctrl float-circle" onclick="openSettingsDrawer()" title="Preferences" aria-label="Settings">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </button>
    </div>
  </nav>

  <!-- Login Main Stage -->
  <main class="page-login-shell">
    <div class="login-card-wrap">

      <section class="glass-card login-card">
        <header class="login-brand-header">
          <div class="wordmark">Kavach<span class="dot"></span></div>
          <p>Document &amp; Identity Forensic Verification</p>
        </header>

        {% if error %}
        <div class="alert-error" role="alert">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="post" action="{{ url_for('login') }}">
          <div class="form-field">
            <label for="email">
              <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
              Officer ID / Work Email
            </label>
            <input class="input-glass"
                   id="email"
                   name="email"
                   type="email"
                   placeholder="officer@agency.gov.in"
                   required
                   autofocus
                   autocomplete="username">
          </div>

          <div class="form-field">
            <label for="password">
              <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
              Security Password
            </label>
            <input class="input-glass"
                   id="password"
                   name="password"
                   type="password"
                   placeholder="Enter officer passcode"
                   required
                   autocomplete="current-password">
          </div>

          <button class="btn-pill btn-primary-orange btn-block btn-lg" type="submit" style="margin-top: 8px;">
            <span>Sign In to Terminal</span>
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
          </button>
        </form>

        <p class="login-legal">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
          Restricted access. All verification sessions and biometric captures are cryptographically logged.
        </p>
      </section>

    </div>
  </main>

  <!-- Floating Settings Drawer -->
  <div class="drawer-backdrop" id="settingsDrawer" role="dialog" aria-modal="true" aria-label="Kiosk Settings">
    <div class="drawer-panel">
      <div class="drawer-header">
        <h3>Preferences</h3>
        <button type="button" class="modal-close-btn" onclick="closeSettingsDrawer()" aria-label="Close">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="settings-section-title">Theme</div>
      <div class="toggle-row">
        <div class="toggle-info">
          <h4>Dark Mode</h4>
          <p>Switch between light ambient and dark obsidian.</p>
        </div>
        <label class="switch" aria-label="Toggle dark mode">
          <input type="checkbox" class="theme-toggle-input">
          <span class="slider"></span>
        </label>
      </div>

      <div class="settings-section-title">Deployment Post</div>
      <div class="location-options-grid">
        <button type="button" class="loc-option-btn active" data-location="Airport Kiosk T3">Airport T3</button>
        <button type="button" class="loc-option-btn" data-location="Border Checkpoint Alpha">Border Post</button>
        <button type="button" class="loc-option-btn" data-location="Customs Inspection Desk">Customs Desk</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/kavach_ui.js') }}"></script>
</body>
</html>
