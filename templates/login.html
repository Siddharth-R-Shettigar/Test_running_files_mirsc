<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kavach | Sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/kavach.css') }}">
</head>
<body class="page-login">
  <main class="login-wrap">
    <span class="wordmark">Kavach</span>
    <p class="login-tag">Document and identity verification</p>
    <section class="login-surface">
      {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
      <form method="post" action="{{ url_for('login') }}">
        <div class="field"><label for="email">Officer ID</label><input id="email" name="email" type="email" placeholder="officer@agency.gov.in" required autofocus></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" placeholder="Enter password" required></div>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>
    </section>
    <p class="login-note">Restricted access. Authorised personnel only.<br>All sessions are logged.</p>
  </main>
</body>
</html>
