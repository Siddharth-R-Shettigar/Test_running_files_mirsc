<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KAVACH | Result</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/kavach.css') }}">
</head>
<body class="page-float">
  <header class="app-topbar">
    <div class="brand-inline">
      <span class="mark">◆</span>
      <em>KAVACH</em>
    </div>
    <nav class="top-links">
      <a href="/cases">Case Logs</a>
      <a href="/logout">Log out</a>
    </nav>
  </header>

  <div class="float-stage">
    <div class="float-card tone-neutral" id="card">
      <div class="edge-badge neutral" id="badge">…</div>

      <div id="phase-scan" class="scan-live">
        <h2>Screening in progress</h2>
        <p class="sub">Detectors running — please wait</p>
        <div class="det-list" id="det-list"></div>
      </div>

      <div id="phase-result" class="fade-swap" hidden>
        <div class="verdict-block">
          <h1 id="v-title">—</h1>
          <p class="prob" id="v-prob">—<span>probability of forgery</span></p>
          <p class="one-line" id="v-why">—</p>
        </div>
        <div class="check-block">
          <h2>Officer checklist</h2>
          <ul id="v-check"></ul>
        </div>
        <div class="float-actions">
          <a class="btn-pill primary" href="/scan/reset">Scan next subject</a>
          <button type="button" class="btn-pill ghost" id="btn-download">Download report</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DEMO_DETECTORS = [
      "Clarity check", "OCR extraction", "Document type", "MRZ validation",
      "Photo-patch forensics", "Copy-move check", "Vision consistency", "Face match"
    ];

    const list = document.getElementById("det-list");
    DEMO_DETECTORS.forEach((name, i) => {
      const row = document.createElement("div");
      row.className = "det-row";
      row.id = "det-" + i;
      row.innerHTML = "<span>" + name + "</span><span class=\"tag\">queued</span>";
      list.appendChild(row);
    });

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    async function runPacedProgress() {
      for (let i = 0; i < DEMO_DETECTORS.length; i++) {
        const row = document.getElementById("det-" + i);
        row.classList.add("active");
        row.querySelector(".tag").textContent = "running";
        await sleep(400);
        row.classList.remove("active");
        row.classList.add("done");
        row.querySelector(".tag").textContent = "done";
      }
    }

    function showVerdict(ui) {
      const tone = ui.color || "yellow";
      document.getElementById("card").className = "float-card tone-" + tone;
      const badge = document.getElementById("badge");
      badge.className = "edge-badge " + tone;
      badge.textContent = tone === "green" ? "✓" : (tone === "red" ? "✕" : "!");

      document.getElementById("phase-scan").hidden = true;
      const res = document.getElementById("phase-result");
      res.hidden = false;

      document.getElementById("v-title").textContent = ui.title || "NEEDS REVIEW";
      document.getElementById("v-prob").innerHTML =
        (ui.risk_pct != null ? ui.risk_pct : "—") + "%<span>probability of forgery</span>";
      document.getElementById("v-why").textContent = ui.why || "";

      const ul = document.getElementById("v-check");
      ul.innerHTML = "";
      (ui.checklist || []).forEach(function (item) {
        const li = document.createElement("li");
        li.innerHTML = "<input type=\"checkbox\"><span>" + item + "</span>";
        ul.appendChild(li);
      });

      document.getElementById("btn-download").onclick = function () {
        const blob = new Blob([JSON.stringify(ui, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "kavach_report.json";
        a.click();
      };
    }

    function demoUi() {
      return {
        color: "yellow",
        title: "NEEDS REVIEW",
        risk_pct: 12.5,
        why: "Demo result — full engine not required for UI. Captures completed.",
        checklist: [
          "Match face to the traveller",
          "Check MRZ and printed dates",
          "Inspect photo area",
          "Escalate if unsure"
        ]
      };
    }

    // API with hard timeout so UI never sticks
    function fetchUi(timeoutMs) {
      const ctrl = new AbortController();
      const t = setTimeout(function () { ctrl.abort(); }, timeoutMs);
      return fetch("/api/run_case", { credentials: "same-origin", signal: ctrl.signal })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; })
        .finally(function () { clearTimeout(t); });
    }

    (async function () {
      // 1) Always animate detectors first (presentation)
      await runPacedProgress();

      // 2) Try API max 6 seconds, then show something
      const ui = (await fetchUi(6000)) || demoUi();
      showVerdict(ui);
    })();
  </script>
</body>
</html>
