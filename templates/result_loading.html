<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kavach | Result</title><link rel="stylesheet" href="{{ url_for('static', filename='css/kavach.css') }}"></head>
<body class="page-float"><header class="app-topbar"><div class="brand-inline"><span class="mark">◆</span><em>Kavach</em></div><nav class="top-links"><a href="{{ url_for('cases') }}">Case logs</a><a href="{{ url_for('logout') }}">Log out</a></nav></header>
<main class="float-stage"><section class="float-card tone-yellow" id="card"><div class="edge-badge" id="badge">!</div><div id="phase-scan"><h2>Screening in progress</h2><p class="sub">Detectors running - please wait</p><div class="det-list" id="det-list"></div></div><div id="phase-result" hidden><div class="verdict-block"><h1 id="v-title">Needs review</h1><p class="prob" id="v-prob">-<span>probability of forgery</span></p><p class="one-line" id="v-why"></p></div><div class="check-block"><h2>Officer checklist</h2><ul id="v-check"></ul></div><div class="float-actions"><a class="btn-pill primary" href="{{ url_for('scan_reset') }}">Scan next subject</a><button class="btn-pill ghost" id="btn-download" type="button">Download report</button></div></div></section></main>
<script>
  const names = ['Clarity check', 'OCR extraction', 'Document type', 'MRZ validation', 'Photo-patch forensics', 'Copy-move check', 'Vision consistency', 'Face match']; const list = document.getElementById('det-list'); names.forEach((name, i) => { list.insertAdjacentHTML('beforeend', '<div class="det-row" id="det-' + i + '"><span>' + name + '</span><span class="tag">queued</span></div>'); }); const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
  async function progress() { for (let i = 0; i < names.length; i += 1) { const row = document.getElementById('det-' + i); row.classList.add('active'); row.querySelector('.tag').textContent = 'running'; await wait(260); row.classList.remove('active'); row.classList.add('done'); row.querySelector('.tag').textContent = 'done'; } }
  function demo() { return { color: 'yellow', title: 'NEEDS REVIEW', risk_pct: 12.5, why: 'Demo result - captures completed. Full engine not required for UI.', checklist: ['Compare document photo to the person present', 'Re-check MRZ and printed dates', 'Inspect the photo area', 'Escalate if unsure'] }; }
  function render(ui) { const tone = ui.color || 'yellow'; document.getElementById('card').className = 'float-card tone-' + tone; document.getElementById('badge').className = 'edge-badge ' + tone; document.getElementById('badge').textContent = tone === 'green' ? 'OK' : tone === 'red' ? '!' : '?'; document.getElementById('phase-scan').hidden = true; document.getElementById('phase-result').hidden = false; document.getElementById('v-title').textContent = ui.title || 'NEEDS REVIEW'; document.getElementById('v-prob').innerHTML = (ui.risk_pct ?? '-') + '%<span>probability of forgery</span>'; document.getElementById('v-why').textContent = ui.why || ''; const checks = document.getElementById('v-check'); checks.innerHTML = ''; (ui.checklist || []).forEach(item => checks.insertAdjacentHTML('beforeend', '<li><input type="checkbox"><span>' + item + '</span></li>')); document.getElementById('btn-download').onclick = () => { const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([JSON.stringify(ui, null, 2)], { type: 'application/json' })); link.download = 'kavach_report.json'; link.click(); }; }
  (async () => { await progress(); let ui = null; try { const response = await fetch('{{ url_for("api_run_case") }}', { credentials: 'same-origin' }); if (response.ok) ui = await response.json(); } catch (_) {} render(ui || demo()); })();
</script></body></html>
